<title id="lesson-flow-title">The lesson flow</title>
<desc id="lesson-flow-desc">A reader starts with the Vellum pipeline overview, the position-based dynamics theory, the node chain map and the Lesson 02 tutorial. The eight lessons then run in four stages: constraints, the first DOP solver, softbodies and solving, and the SOP solver with the post process. Concepts, syntheses and entities are reference, and the verbatim transcripts sit behind the scenes.</desc>
