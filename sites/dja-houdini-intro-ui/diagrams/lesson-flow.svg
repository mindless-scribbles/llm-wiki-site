<title id="lesson-flow-title">The lesson flow</title>
<desc id="lesson-flow-desc">A reader starts with the hotkey cheatsheet and the Lesson 00-5 info dump warning. The eighteen lessons then run in five stages: orientation, working in the viewport, display, time and animation, and inspecting and organizing. Concepts, syntheses and entities are reference.</desc>
