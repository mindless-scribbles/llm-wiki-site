<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 704 304" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="course-flow-title course-flow-desc" id="course-flow-root">
<title id="course-flow-title">The Rigging with Matrices series flow</title>
<desc id="course-flow-desc">A reader starts with the foundational videos, the Mastering Matrices theory video and Part 01, then takes four stages in order: FK, IK, IK/FK blending and animator features. Every stage links to concepts and entities. Syntheses compare solvers and shape driving. The step-by-step presentations sit behind the scenes.</desc>
