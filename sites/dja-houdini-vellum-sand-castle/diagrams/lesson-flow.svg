<title id="lesson-flow-title">The lesson flow</title>
<desc id="lesson-flow-desc">A reader starts at the grain simulation basics, then the sand castle node chain, then three key concept pages, then the Lesson 02 tutorial, and works through fifteen lessons in six stages: scene and grains, shape match and impact, glue and wet sand, the low-res sim, high-res and up-res, and the final render. Concepts, the node chain and entities are reference. The verbatim transcripts and flashcards sit behind the scenes.</desc>
