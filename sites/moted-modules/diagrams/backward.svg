<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 704 472" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="backward-title backward-desc" id="backward-root">
        <title id="backward-title">One frame of a stock bake</title>
        <desc id="backward-desc">Message order for one baked frame: the take poses the bones, the backward event reads them and writes the controls it knows, and the section keys the controls; a control nothing wrote is keyed at its initial value.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #backward-root { --color-paper:   #1a1a1d;
      --color-ink:     #f2f2f3;
      --color-muted:   #a1a1aa;
      --color-accent:  #ff3300;
      --font-sans:     'Hanken Grotesk', system-ui, sans-serif;
      --font-serif:    'Syne', system-ui, sans-serif;
      --font-mono:     'Space Mono', ui-monospace, monospace; }
      #backward-root { font-family: var(--font-sans); color: var(--color-ink); }
      #backward-root .diagram-container { width: 100%; max-width: 704px; margin: 0 auto; overflow-x: auto; }
      #backward-root .head { max-width: 704px; margin: 0 auto; }
      #backward-root .diagram-container { overflow-x: visible; }</style>
          <marker id="backward-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a1a1aa"/></marker>
          <marker id="backward-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ff3300"/></marker>
          <marker id="backward-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b4b4bb"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#1a1a1d"/>

