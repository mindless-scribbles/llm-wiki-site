<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One frame of a stock bake</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #1a1a1d;
      --color-ink:     #f2f2f3;
      --color-muted:   #a1a1aa;
      --color-accent:  #ff3300;
      --font-sans:     'Hanken Grotesk', system-ui, sans-serif;
      --font-serif:    'Syne', system-ui, sans-serif;
      --font-mono:     'Space Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; max-width: 704px; margin: 0 auto; overflow-x: auto; }
    .head { max-width: 704px; margin: 0 auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 704px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="head">
      <p class="eyebrow">Sequence · Diagram Design</p>
      <h1>One frame of a stock bake</h1>
    </div>
    <div class="diagram-container">
      <svg viewBox="0 0 704 472" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="backward-title backward-desc">
        <title id="backward-title">One frame of a stock bake</title>
        <desc id="backward-desc">Message order for one baked frame: the take poses the bones, the backward event reads them and writes the controls it knows, and the section keys the controls; a control nothing wrote is keyed at its initial value.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a1a1aa"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ff3300"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b4b4bb"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#1a1a1d"/>

<line x1="80" y1="64" x2="80" y2="388" stroke="rgba(242,242,243,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="218" y1="64" x2="218" y2="388" stroke="rgba(242,242,243,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="356" y1="64" x2="356" y2="388" stroke="rgba(242,242,243,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="494" y1="64" x2="494" y2="388" stroke="rgba(242,242,243,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="632" y1="64" x2="632" y2="388" stroke="rgba(242,242,243,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="80" y1="112" x2="218" y2="112" stroke="#a1a1aa" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="218" y1="168" x2="356" y2="168" stroke="#a1a1aa" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="356" y1="232" x2="494" y2="232" stroke="#ff3300" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<line x1="494" y1="296" x2="632" y2="296" stroke="#a1a1aa" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="107" y="94" width="84" height="12" rx="2" fill="#1a1a1d"/>
<text x="149.0" y="102.5" fill="#a1a1aa" font-size="8" font-family="'Space Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.02em">pose the frame</text>
<rect x="231" y="150" width="112" height="12" rx="2" fill="#1a1a1d"/>
<text x="287.0" y="158.5" fill="#a1a1aa" font-size="8" font-family="'Space Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.02em">run InverseExecution</text>
<rect x="373" y="204" width="104" height="22" rx="2" fill="#1a1a1d"/>
<text x="425.0" y="212.5" fill="#ff3300" font-size="8" font-family="'Space Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.02em">write each control</text>
<text x="425.0" y="222.5" fill="#ff3300" font-size="8" font-family="'Space Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.02em">it knows</text>
<rect x="517" y="278" width="92" height="12" rx="2" fill="#1a1a1d"/>
<text x="563.0" y="286.5" fill="#a1a1aa" font-size="8" font-family="'Space Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.02em">key the controls</text>
<rect x="464" y="328" width="200" height="44" rx="4" fill="#1a1a1d"/>
<rect x="464" y="328" width="200" height="44" rx="4" fill="rgba(255,51,0,0.10)" stroke="#ff3300" stroke-width="1" stroke-dasharray="4,3"/>
<text x="564.0" y="347" fill="#f2f2f3" font-size="9" font-family="'Space Mono', ui-monospace, monospace" text-anchor="middle">a control nothing wrote is</text>
<text x="564.0" y="360" fill="#f2f2f3" font-size="9" font-family="'Space Mono', ui-monospace, monospace" text-anchor="middle">keyed at its initial value</text>
<rect x="20" y="16" width="120" height="48" rx="6" fill="#1a1a1d"/>
<rect x="20" y="16" width="120" height="48" rx="6" fill="#222226" stroke="#5a5a60" stroke-width="1"/>
<text x="80" y="44" fill="#f2f2f3" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">Take</text>
<rect x="158" y="16" width="120" height="48" rx="6" fill="#1a1a1d"/>
<rect x="158" y="16" width="120" height="48" rx="6" fill="#222226" stroke="#5a5a60" stroke-width="1"/>
<text x="218" y="44" fill="#f2f2f3" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">Bones</text>
<rect x="296" y="16" width="120" height="48" rx="6" fill="#1a1a1d"/>
<rect x="296" y="16" width="120" height="48" rx="6" fill="#222226" stroke="#5a5a60" stroke-width="1"/>
<text x="356" y="44" fill="#f2f2f3" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">Backward event</text>
<rect x="434" y="16" width="120" height="48" rx="6" fill="#1a1a1d"/>
<rect x="434" y="16" width="120" height="48" rx="6" fill="#222226" stroke="#5a5a60" stroke-width="1"/>
<text x="494" y="44" fill="#f2f2f3" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">Controls</text>
<rect x="572" y="16" width="120" height="48" rx="6" fill="#1a1a1d"/>
<rect x="572" y="16" width="120" height="48" rx="6" fill="#222226" stroke="#5a5a60" stroke-width="1"/>
<text x="632" y="44" fill="#f2f2f3" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">Section</text>
<line x1="16" y1="420" x2="688" y2="420" stroke="rgba(244,244,245,0.10)" stroke-width="0.8"/>
<text x="16" y="436" fill="#a1a1aa" font-size="8" font-family="'Space Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
<line x1="16" y1="449" x2="44" y2="449" stroke="#ff3300" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<text x="52" y="452" fill="#a1a1aa" font-size="9" font-family="'Hanken Grotesk', system-ui, sans-serif">Focal call: the mapping</text>
<line x1="208" y1="449" x2="236" y2="449" stroke="#a1a1aa" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="244" y="452" fill="#a1a1aa" font-size="9" font-family="'Hanken Grotesk', system-ui, sans-serif">Call</text>
<rect x="304" y="443" width="24" height="12" rx="2" fill="rgba(255,51,0,0.10)" stroke="#ff3300" stroke-width="1" stroke-dasharray="4,3"/>
<text x="336" y="452" fill="#a1a1aa" font-size="9" font-family="'Hanken Grotesk', system-ui, sans-serif">Note: the gotcha</text>
      </svg>
    </div>
  </div>
</body>
</html>
