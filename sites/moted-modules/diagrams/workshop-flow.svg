<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 704 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workshop-flow-title workshop-flow-desc" id="workshop-flow-root">
        <title id="workshop-flow-title">The workshop flow</title>
        <desc id="workshop-flow-desc">A reader starts at the Workshop Overview, then works through the ten days in order: theory videos are watched before Days 4, 7 and 10, and each day links out to the modules it builds and to the concepts, solves and characters, while summaries, the journal and the flashcards sit behind the scenes.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #workshop-flow-root { --color-paper:   #1a1a1d;
      --color-ink:     #f2f2f3;
      --color-muted:   #a1a1aa;
      --color-accent:  #ff3300;
      --font-sans:     'Hanken Grotesk', system-ui, sans-serif;
      --font-serif:    'Syne', system-ui, sans-serif;
      --font-mono:     'Space Mono', ui-monospace, monospace; }
      #workshop-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #workshop-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      #workshop-flow-root .diagram-container { overflow-x: visible; }</style>
          <marker id="workshop-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a1a1aa"/></marker>
          <marker id="workshop-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ff3300"/></marker>
          <marker id="workshop-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b4b4bb"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#1a1a1d"/>

        <!-- Row labels (left margin) -->
        <g font-family="'Space Mono', monospace" font-size="8" letter-spacing="0.18em" fill="#8b8b94" text-anchor="end">
          <text x="84" y="70">WATCH FIRST</text>
          <text x="84" y="174">THE PATH</text>
          <text x="84" y="262">MODULES</text>
          <text x="84" y="350">CONCEPTS</text>
          <text x="84" y="394">SOLVES</text>
          <text x="84" y="450">PROVE ON</text>
          <text x="84" y="516">BEHIND</text>
          <text x="84" y="528">THE SCENES</text>
        </g>

        <!-- Row dividers -->
        <g stroke="#f4f4f5" stroke-opacity="0.10" stroke-width="1">
          <line x1="96" y1="216" x2="688" y2="216"/>
          <line x1="96" y1="316" x2="688" y2="316"/>
          <line x1="96" y1="416" x2="688" y2="416"/>
        </g>

        <!-- ===== Connectors (drawn before nodes) ===== -->
        <!-- Path order -->
        <g stroke="#a1a1aa" stroke-width="1" fill="none">
          <line x1="204" y1="170" x2="219" y2="170" stroke="#ff3300" marker-end="url(#workshop-flow-arrow-accent)"/>
          <line x1="324" y1="170" x2="339" y2="170" marker-end="url(#workshop-flow-arrow)"/>
          <line x1="444" y1="170" x2="459" y2="170" marker-end="url(#workshop-flow-arrow)"/>
          <line x1="564" y1="170" x2="579" y2="170" marker-end="url(#workshop-flow-arrow)"/>
        </g>

        <!-- Watch first: theory down into the day that needs it -->
        <g stroke="#b4b4bb" stroke-width="1" stroke-dasharray="5,4" fill="none">
          <line x1="392" y1="102" x2="392" y2="143" marker-end="url(#workshop-flow-arrow-link)"/>
          <line x1="512" y1="102" x2="512" y2="143" marker-end="url(#workshop-flow-arrow-link)"/>
          <line x1="632" y1="102" x2="632" y2="143" marker-end="url(#workshop-flow-arrow-link)"/>
        </g>

        <!-- Each day links down to the modules it builds -->
        <g stroke="#b4b4bb" stroke-width="1" stroke-dasharray="5,4" fill="none">
          <line x1="272" y1="196" x2="272" y2="231" marker-end="url(#workshop-flow-arrow-link)"/>
          <line x1="392" y1="196" x2="392" y2="231" marker-end="url(#workshop-flow-arrow-link)"/>
          <line x1="512" y1="196" x2="512" y2="231" marker-end="url(#workshop-flow-arrow-link)"/>
          <line x1="632" y1="196" x2="632" y2="231" marker-end="url(#workshop-flow-arrow-link)"/>
        </g>

        <!-- Start here: Overview, then the True Match -->
        <line x1="152" y1="196" x2="152" y2="327" stroke="#a1a1aa" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#workshop-flow-arrow)"/>

        <!-- Arrow labels (masked, beside the vertical segments) -->
        <g font-family="'Space Mono', monospace" font-size="8" letter-spacing="0.06em" fill="#a1a1aa">
          <rect x="400" y="116" width="32" height="12" fill="#1a1a1d"/>
          <text x="402" y="125">DAY 4</text>
          <rect x="520" y="116" width="32" height="12" fill="#1a1a1d"/>
          <text x="522" y="125">DAY 7</text>
          <rect x="640" y="116" width="40" height="12" fill="#1a1a1d"/>
          <text x="642" y="125">DAY 10</text>
          <rect x="160" y="256" width="32" height="12" fill="#1a1a1d"/>
          <text x="162" y="265">THEN</text>
        </g>

        <!-- ===== Nodes ===== -->
        <!-- Watch first: theory pages (input treatment) -->
        <g font-family="'Hanken Grotesk', sans-serif" font-size="12" font-weight="600" fill="#f2f2f3" text-anchor="middle">
          <rect x="340" y="4" width="104" height="22" rx="4" fill="#a1a1aa" fill-opacity="0.10" stroke="#8b8b94" stroke-width="0.8"/>
          <text x="392" y="19">Six Into Four</text>
          <rect x="340" y="30" width="104" height="22" rx="4" fill="#a1a1aa" fill-opacity="0.10" stroke="#8b8b94" stroke-width="0.8"/>
          <text x="392" y="45">Swing-Twist</text>
          <rect x="340" y="56" width="104" height="46" rx="4" fill="#a1a1aa" fill-opacity="0.10" stroke="#8b8b94" stroke-width="0.8"/>
          <text x="392" y="71">Pole From</text>
          <text x="392" y="85">Position, and</text>
          <text x="392" y="99">the Loop</text>

          <rect x="460" y="66" width="104" height="36" rx="4" fill="#a1a1aa" fill-opacity="0.10" stroke="#8b8b94" stroke-width="0.8"/>
          <text x="512" y="81">Count What a</text>
          <text x="512" y="95">Curve Can Reach</text>

          <rect x="580" y="80" width="104" height="22" rx="4" fill="#a1a1aa" fill-opacity="0.10" stroke="#8b8b94" stroke-width="0.8"/>
          <text x="632" y="95">Bend Weights</text>
        </g>

        <!-- The path -->
        <g font-family="'Hanken Grotesk', sans-serif" text-anchor="middle">
          <!-- focal: the entry point -->
          <rect x="100" y="144" width="104" height="52" rx="1" fill="#1a1a1d"/>
          <rect x="100" y="144" width="104" height="52" rx="6" fill="#ff3300" fill-opacity="0.10" stroke="#ff3300" stroke-width="1.2"/>
          <text x="152" y="161" font-size="12" font-weight="600" fill="#f2f2f3">Workshop</text>
          <text x="152" y="175" font-size="12" font-weight="600" fill="#f2f2f3">Overview</text>
          <text x="152" y="188" font-family="'Space Mono', monospace" font-size="9" fill="#a1a1aa">start here</text>

          <rect x="220" y="144" width="104" height="52" rx="6" fill="#222226" stroke="#5a5a60" stroke-width="1"/>
          <text x="272" y="168" font-size="12" font-weight="600" fill="#f2f2f3">Day 1</text>
          <text x="272" y="184" font-family="'Space Mono', monospace" font-size="9" fill="#a1a1aa">bench · FK kit</text>

          <rect x="340" y="144" width="104" height="52" rx="6" fill="#222226" stroke="#5a5a60" stroke-width="1"/>
          <text x="392" y="168" font-size="12" font-weight="600" fill="#f2f2f3">Days 2–6</text>
          <text x="392" y="184" font-family="'Space Mono', monospace" font-size="9" fill="#a1a1aa">the limb</text>

          <rect x="460" y="144" width="104" height="52" rx="6" fill="#222226" stroke="#5a5a60" stroke-width="1"/>
          <text x="512" y="168" font-size="12" font-weight="600" fill="#f2f2f3">Days 7–9</text>
          <text x="512" y="184" font-family="'Space Mono', monospace" font-size="9" fill="#a1a1aa">the spine</text>

          <rect x="580" y="144" width="104" height="52" rx="6" fill="#222226" stroke="#5a5a60" stroke-width="1"/>
          <text x="632" y="168" font-size="12" font-weight="600" fill="#f2f2f3">Day 10</text>
          <text x="632" y="184" font-family="'Space Mono', monospace" font-size="9" fill="#a1a1aa">head · biped</text>
        </g>

        <!-- Modules, built where the day builds them (store treatment) -->
        <g font-family="'Hanken Grotesk', sans-serif" font-size="12" font-weight="600" fill="#f2f2f3" text-anchor="middle">
          <rect x="220" y="232" width="104" height="22" rx="4" fill="#141416" stroke="#a1a1aa" stroke-width="0.8"/>
          <text x="272" y="247">FNRoot</text>
          <rect x="220" y="258" width="104" height="22" rx="4" fill="#141416" stroke="#a1a1aa" stroke-width="0.8"/>
          <text x="272" y="273">Body</text>
          <rect x="220" y="284" width="104" height="22" rx="4" fill="#141416" stroke="#a1a1aa" stroke-width="0.8"/>
          <text x="272" y="299">FkChain</text>

          <rect x="340" y="232" width="104" height="22" rx="4" fill="#141416" stroke="#a1a1aa" stroke-width="0.8"/>
          <text x="392" y="247">Limb</text>
          <rect x="340" y="258" width="104" height="22" rx="4" fill="#141416" stroke="#a1a1aa" stroke-width="0.8"/>
          <text x="392" y="273">LimbTwist</text>

          <rect x="460" y="232" width="104" height="22" rx="4" fill="#141416" stroke="#a1a1aa" stroke-width="0.8"/>
          <text x="512" y="247">SpineChain</text>

          <rect x="580" y="232" width="104" height="22" rx="4" fill="#141416" stroke="#a1a1aa" stroke-width="0.8"/>
          <text x="632" y="247">Head</text>
        </g>

        <!-- Concepts and solves: every day dips in (external treatment) -->
        <g font-family="'Hanken Grotesk', sans-serif">
          <rect x="100" y="328" width="104" height="36" rx="6" fill="#f2f2f3" fill-opacity="0.03" stroke="#f2f2f3" stroke-opacity="0.30" stroke-width="1"/>
          <text x="152" y="343" font-size="12" font-weight="600" fill="#f2f2f3" text-anchor="middle">The True</text>
          <text x="152" y="357" font-size="12" font-weight="600" fill="#f2f2f3" text-anchor="middle">FK/IK Match</text>

          <rect x="220" y="328" width="464" height="36" rx="6" fill="#f2f2f3" fill-opacity="0.03" stroke="#f2f2f3" stroke-opacity="0.30" stroke-width="1"/>
          <text x="232" y="343" font-size="12" font-weight="600" fill="#f2f2f3">Concepts</text>
          <text x="232" y="357" font-family="'Space Mono', monospace" font-size="9" fill="#a1a1aa">count · carry · key, asked of every module</text>

          <rect x="220" y="372" width="464" height="36" rx="6" fill="#f2f2f3" fill-opacity="0.03" stroke="#f2f2f3" stroke-opacity="0.30" stroke-width="1"/>
          <text x="232" y="387" font-size="12" font-weight="600" fill="#f2f2f3">Solves</text>
          <text x="232" y="401" font-family="'Space Mono', monospace" font-size="9" fill="#a1a1aa">construction › forward › backward › FK/IK match</text>
        </g>

        <!-- Characters -->
        <g font-family="'Hanken Grotesk', sans-serif">
          <rect x="220" y="428" width="224" height="36" rx="6" fill="#141416" stroke="#a1a1aa" stroke-width="0.8"/>
          <text x="232" y="443" font-size="12" font-weight="600" fill="#f2f2f3">Guardian</text>
          <text x="232" y="457" font-family="'Space Mono', monospace" font-size="9" fill="#a1a1aa">257 bones · built on first</text>

          <rect x="460" y="428" width="224" height="36" rx="6" fill="#141416" stroke="#a1a1aa" stroke-width="0.8"/>
          <text x="472" y="443" font-size="12" font-weight="600" fill="#f2f2f3">Zombie</text>
          <text x="472" y="457" font-family="'Space Mono', monospace" font-size="9" fill="#a1a1aa">80 bones · joins on Day 7</text>
        </g>

        <!-- Line of visibility: the reader's path above, sources and tooling below -->
        <line x1="96" y1="484" x2="688" y2="484" stroke="#f2f2f3" stroke-opacity="0.55" stroke-width="2" data-role="visibility"/>

        <!-- Behind the scenes (optional treatment) -->
        <g font-family="'Hanken Grotesk', sans-serif">
          <rect x="100" y="500" width="184" height="40" rx="6" fill="#f2f2f3" fill-opacity="0.02" stroke="#f2f2f3" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
          <text x="112" y="517" font-size="12" font-weight="600" fill="#a1a1aa">Summaries</text>
          <text x="112" y="531" font-family="'Space Mono', monospace" font-size="9" fill="#8b8b94">4 source digests</text>

          <rect x="296" y="500" width="160" height="40" rx="6" fill="#f2f2f3" fill-opacity="0.02" stroke="#f2f2f3" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
          <text x="308" y="517" font-size="12" font-weight="600" fill="#a1a1aa">Journal</text>
          <text x="308" y="531" font-family="'Space Mono', monospace" font-size="9" fill="#8b8b94">1 writing experiment</text>

          <rect x="468" y="500" width="216" height="40" rx="6" fill="#f2f2f3" fill-opacity="0.02" stroke="#f2f2f3" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
          <text x="480" y="517" font-size="12" font-weight="600" fill="#a1a1aa">Flashcards</text>
          <text x="480" y="531" font-family="'Space Mono', monospace" font-size="9" fill="#8b8b94">1 review deck</text>
        </g>

        <!-- Legend strip -->
        <line x1="96" y1="560" x2="688" y2="560" stroke="#f4f4f5" stroke-opacity="0.10" stroke-width="1"/>
        <g font-family="'Space Mono', monospace" font-size="8" letter-spacing="0.06em" fill="#a1a1aa">
          <rect x="96" y="572" width="16" height="12" rx="2" fill="#ff3300" fill-opacity="0.10" stroke="#ff3300" stroke-width="1"/>
          <text x="120" y="581">START HERE</text>
          <line x1="200" y1="578" x2="228" y2="578" stroke="#a1a1aa" stroke-width="1" marker-end="url(#workshop-flow-arrow)"/>
          <text x="236" y="581">READ IN ORDER</text>
          <line x1="336" y1="578" x2="364" y2="578" stroke="#b4b4bb" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#workshop-flow-arrow-link)"/>
          <text x="372" y="581">LINKED FROM THE DAY</text>
          <line x1="500" y1="578" x2="528" y2="578" stroke="#f2f2f3" stroke-opacity="0.55" stroke-width="2"/>
          <text x="536" y="581">NOT ON THE PATH BELOW</text>
        </g>
      </svg>
