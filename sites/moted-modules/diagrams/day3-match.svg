<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 704 472" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="day3-match-title day3-match-desc" id="day3-match-root">
        <title id="day3-match-title">Match controls to the FK pose</title>
        <desc id="day3-match-desc">With the bones posed by FK, two graphs each read the bones and set a control: one matches the pole vector control, the other matches the IK control.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #day3-match-root { --color-paper:   #1a1a1d;
      --color-ink:     #f2f2f3;
      --color-muted:   #a1a1aa;
      --color-accent:  #ff3300;
      --font-sans:     'Hanken Grotesk', system-ui, sans-serif;
      --font-serif:    'Syne', system-ui, sans-serif;
      --font-mono:     'Space Mono', ui-monospace, monospace; }
      #day3-match-root { font-family: var(--font-sans); color: var(--color-ink); }
      #day3-match-root .diagram-container { width: 100%; max-width: 704px; margin: 0 auto; overflow-x: auto; }
      #day3-match-root .head { max-width: 704px; margin: 0 auto; }
      #day3-match-root .diagram-container { overflow-x: visible; }</style>
