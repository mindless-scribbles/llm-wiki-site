<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 704 504" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="day3-switch-title day3-switch-desc" id="day3-switch-root">
        <title id="day3-switch-title">Forward Limb: one evaluation</title>
        <desc id="day3-switch-desc">Message order for one evaluation of Forward Limb: the IK on channel picks FK or IK mode; FK mode runs Forward FK then Backward IK, IK mode runs Basic IK then Backward FK, so each branch drives the bones and then puts the other side on them.</desc>
