<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 704 592" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="assembly-title assembly-desc" id="assembly-root">
        <title id="assembly-title">An assembly is a tree of modules</title>
        <desc id="assembly-desc">Assembly tree: Root (FNRoot) parents Body, then Spine (SpineChain), which parents Head, the legs and the clavicles; each Limb parents its twists and its ball or fingers.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #assembly-root { --color-paper:   #1a1a1d;
      --color-ink:     #f2f2f3;
      --color-muted:   #a1a1aa;
      --color-accent:  #ff3300;
      --font-sans:     'Hanken Grotesk', system-ui, sans-serif;
      --font-serif:    'Syne', system-ui, sans-serif;
      --font-mono:     'Space Mono', ui-monospace, monospace; }
      #assembly-root { font-family: var(--font-sans); color: var(--color-ink); }
      #assembly-root .diagram-container { width: 100%; max-width: 704px; margin: 0 auto; overflow-x: auto; }
      #assembly-root .head { max-width: 704px; margin: 0 auto; }
      #assembly-root .diagram-container { overflow-x: visible; }</style>
          <marker id="assembly-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a1a1aa"/></marker>
          <marker id="assembly-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ff3300"/></marker>
          <marker id="assembly-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b4b4bb"/></marker>
        </defs>
