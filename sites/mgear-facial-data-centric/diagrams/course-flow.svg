<title id="course-flow-title">The workshop course flow</title>
<desc id="course-flow-desc">A reader starts at the workshop introduction, then takes five parts in order: 101 fundamentals, base and proportions, mouth sliding, lips, and mouth blendshapes. Every part links out to concepts and entities. Syntheses compare the tool and stacking choices.</desc>
