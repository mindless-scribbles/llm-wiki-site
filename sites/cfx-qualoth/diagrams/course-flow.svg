<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 704 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="course-flow-title course-flow-desc" id="course-flow-root">
<title id="course-flow-title">The course flow</title>
<desc id="course-flow-desc">A reader starts with five concepts: CFX Scope, CFX Production Planning, Simulation Master File, then the cloth track (Input Mesh, Cloth Mesh and Solver) or the hair track (Guide-Curve Hair Pipeline). The eight weekly lessons then run in five stages: plan, cloth setup, hair setup, draping, and shot work. Concepts, entities and syntheses are reference. Flashcards sit behind the scenes.</desc>
