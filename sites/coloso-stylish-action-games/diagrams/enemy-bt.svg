      --font-sans:     'Hanken Grotesk', system-ui, sans-serif;
      --font-serif:    'Syne', system-ui, sans-serif;
      --font-mono:     'Space Mono', ui-monospace, monospace; }
      #enemy-bt-root { font-family: var(--font-sans); color: var(--color-ink); }
      #enemy-bt-root .diagram-container { width: 100%; overflow-x: auto; }
      #enemy-bt-root .diagram-container { overflow-x: visible; }</style>
