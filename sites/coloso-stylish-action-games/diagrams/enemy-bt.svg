        <title id="enemy-bt-title">BT_ScifiSoo behavior tree after lesson 78</title>
        <desc id="enemy-bt-desc">Behavior tree where a Root Selector tries a close-range Melee Selector first, then GunFire, and Melee rolls a dice to pick Dodge 40% of the time or Sword ATTACK 60%.</desc>
