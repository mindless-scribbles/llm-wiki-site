<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero StateTree</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #1a1a1d;
      --color-ink:     #f2f2f3;
      --color-muted:   #a1a1aa;
      --color-accent:  #ff3300;
      --font-sans:     'Hanken Grotesk', system-ui, sans-serif;
      --font-serif:    'Syne', system-ui, sans-serif;
      --font-mono:     'Space Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 704px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · Lesson 76</p>
    <h1>Dodge is one edge in the hero StateTree</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 704 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-statetree-title hero-statetree-desc">
        <title id="hero-statetree-title">Hero StateTree: Ready, Falling and Dodge</title>
        <desc id="hero-statetree-desc">State machine of ScifiSooHeroStateTree in which Ready moves to Falling on tick while Is Falling is true, moves to Dodge only on the Character.Dodge event sent from IA_Dodge through TryAction, and Dodge returns through Root to Ready when its montage completes.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a1a1aa"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ff3300"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b4b4bb"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#1a1a1d"/>

        <!-- Transitions and links (drawn first) -->
        <!-- Root to Ready: automatic, first child -->
        <line x1="352" y1="88" x2="352" y2="168" stroke="#a1a1aa" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Ready to Falling: On Tick, Is Falling -->
        <line x1="280" y1="204" x2="168" y2="204" stroke="#a1a1aa" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Ready to Dodge: On Event (focal) -->
        <line x1="424" y1="204" x2="536" y2="204" stroke="#ff3300" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- Falling to Root: On Tick, not Is Falling -->
        <path d="M 96 168 L 96 64 Q 96 56 104 56 L 280 56" fill="none" stroke="#a1a1aa" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Dodge to Root: On State Completed -->
        <path d="M 608 168 L 608 64 Q 608 56 600 56 L 424 56" fill="none" stroke="#a1a1aa" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Evaluator to Falling (dashed) -->
        <line x1="72" y1="336" x2="72" y2="240" stroke="#a1a1aa" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- Evaluator to Ready (dashed elbow) -->
        <path d="M 124 336 L 124 304 Q 124 296 132 296 L 316 296 Q 324 296 324 288 L 324 240" fill="none" stroke="#a1a1aa" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- TryAction to Ready: Send State Tree Event -->
        <line x1="388" y1="336" x2="388" y2="240" stroke="#a1a1aa" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- IA_Dodge to TryAction -->
        <line x1="304" y1="372" x2="344" y2="372" stroke="#a1a1aa" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Play Montage to Dodge: sets Is Completed (dashed) -->
        <line x1="616" y1="336" x2="616" y2="240" stroke="#a1a1aa" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- Transition labels -->
        <rect x="360" y="122" width="68" height="12" rx="2" fill="#1a1a1d"/>
        <text x="394" y="131" fill="#8b8b94" font-size="8" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FIRST CHILD</text>

        <rect x="198" y="186" width="52" height="12" rx="2" fill="#1a1a1d"/>
        <text x="224" y="195" fill="#8b8b94" font-size="8" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ON TICK</text>
        <rect x="188" y="210" width="72" height="12" rx="2" fill="#1a1a1d"/>
        <text x="224" y="219" fill="#8b8b94" font-size="8" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.06em">IS FALLING</text>

        <rect x="454" y="186" width="52" height="12" rx="2" fill="#1a1a1d"/>
        <text x="480" y="195" fill="#ff3300" font-size="8" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ON EVENT</text>
        <rect x="438" y="210" width="84" height="12" rx="2" fill="#1a1a1d"/>
        <text x="480" y="219" fill="#ff3300" font-size="8" font-family="'Space Mono', monospace" text-anchor="middle">Character.Dodge</text>

        <rect x="166" y="38" width="52" height="12" rx="2" fill="#1a1a1d"/>
        <text x="192" y="47" fill="#8b8b94" font-size="8" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ON TICK</text>
        <rect x="150" y="62" width="84" height="12" rx="2" fill="#1a1a1d"/>
        <text x="192" y="71" fill="#8b8b94" font-size="8" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NOT FALLING</text>

        <rect x="482" y="38" width="60" height="12" rx="2" fill="#1a1a1d"/>
        <text x="512" y="47" fill="#8b8b94" font-size="8" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ON STATE</text>
        <rect x="480" y="62" width="64" height="12" rx="2" fill="#1a1a1d"/>
        <text x="512" y="71" fill="#8b8b94" font-size="8" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.06em">COMPLETED</text>

        <rect x="396" y="282" width="68" height="12" rx="2" fill="#1a1a1d"/>
        <text x="430" y="291" fill="#8b8b94" font-size="8" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SEND EVENT</text>

        <rect x="530" y="282" width="78" height="12" rx="2" fill="#1a1a1d"/>
        <text x="569" y="291" fill="#8b8b94" font-size="8" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.06em">IS COMPLETED</text>

        <!-- State: Root -->
        <rect x="280" y="24" width="144" height="64" rx="6" fill="#1a1a1d"/>
        <rect x="280" y="24" width="144" height="64" rx="6" fill="#222226" stroke="#5a5a60" stroke-width="1"/>
        <rect x="288" y="30" width="36" height="12" rx="2" fill="transparent" stroke="rgba(242,242,243,0.40)" stroke-width="0.8"/>
        <text x="306" y="39" fill="#a1a1aa" font-size="7" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="352" y="62" fill="#f2f2f3" font-size="12" font-weight="600" font-family="'Hanken Grotesk', sans-serif" text-anchor="middle">Root</text>
        <text x="352" y="77" fill="#a1a1aa" font-size="9" font-family="'Space Mono', monospace" text-anchor="middle">cannot be removed</text>

        <!-- State: Ready -->
        <rect x="280" y="168" width="144" height="72" rx="6" fill="#1a1a1d"/>
        <rect x="280" y="168" width="144" height="72" rx="6" fill="#222226" stroke="#5a5a60" stroke-width="1"/>
        <rect x="288" y="174" width="36" height="12" rx="2" fill="transparent" stroke="rgba(242,242,243,0.40)" stroke-width="0.8"/>
        <text x="306" y="183" fill="#a1a1aa" font-size="7" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="352" y="206" fill="#f2f2f3" font-size="12" font-weight="600" font-family="'Hanken Grotesk', sans-serif" text-anchor="middle">Ready</text>
        <text x="352" y="220" fill="#a1a1aa" font-size="9" font-family="'Space Mono', monospace" text-anchor="middle">first child</text>
        <text x="352" y="232" fill="#a1a1aa" font-size="9" font-family="'Space Mono', monospace" text-anchor="middle">Run Forever</text>

        <!-- State: Falling -->
        <rect x="24" y="168" width="144" height="72" rx="6" fill="#1a1a1d"/>
        <rect x="24" y="168" width="144" height="72" rx="6" fill="#222226" stroke="#5a5a60" stroke-width="1"/>
        <rect x="32" y="174" width="36" height="12" rx="2" fill="transparent" stroke="rgba(242,242,243,0.40)" stroke-width="0.8"/>
        <text x="50" y="183" fill="#a1a1aa" font-size="7" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="96" y="206" fill="#f2f2f3" font-size="12" font-weight="600" font-family="'Hanken Grotesk', sans-serif" text-anchor="middle">Falling</text>
        <text x="96" y="220" fill="#a1a1aa" font-size="9" font-family="'Space Mono', monospace" text-anchor="middle">Run Forever</text>
        <text x="96" y="232" fill="#a1a1aa" font-size="9" font-family="'Space Mono', monospace" text-anchor="middle">no Dodge edge</text>

        <!-- State: Dodge (focal) -->
        <rect x="536" y="168" width="144" height="72" rx="6" fill="#1a1a1d"/>
        <rect x="536" y="168" width="144" height="72" rx="6" fill="rgba(255,51,0,0.10)" stroke="#ff3300" stroke-width="1"/>
        <rect x="544" y="174" width="36" height="12" rx="2" fill="transparent" stroke="rgba(255,51,0,0.50)" stroke-width="0.8"/>
        <text x="562" y="183" fill="#f2f2f3" font-size="7" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="608" y="206" fill="#f2f2f3" font-size="12" font-weight="600" font-family="'Hanken Grotesk', sans-serif" text-anchor="middle">Dodge</text>
        <text x="608" y="220" fill="#a1a1aa" font-size="9" font-family="'Space Mono', monospace" text-anchor="middle">STT_ScifiSoo_Dodge</text>
        <text x="608" y="232" fill="#a1a1aa" font-size="9" font-family="'Space Mono', monospace" text-anchor="middle">returns Running</text>

        <!-- Evaluator -->
        <rect x="24" y="336" width="144" height="72" rx="6" fill="#1a1a1d"/>
        <rect x="24" y="336" width="144" height="72" rx="6" fill="#1a1a1d" stroke="#a1a1aa" stroke-width="1"/>
        <rect x="32" y="342" width="56" height="12" rx="2" fill="transparent" stroke="rgba(242,242,243,0.40)" stroke-width="0.8"/>
        <text x="60" y="351" fill="#a1a1aa" font-size="7" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EVALUATOR</text>
        <text x="96" y="374" fill="#f2f2f3" font-size="12" font-weight="600" font-family="'Hanken Grotesk', sans-serif" text-anchor="middle">Is Falling</text>
        <text x="96" y="388" fill="#a1a1aa" font-size="9" font-family="'Space Mono', monospace" text-anchor="middle">CharacterStateTreeEval</text>
        <text x="96" y="400" fill="#a1a1aa" font-size="9" font-family="'Space Mono', monospace" text-anchor="middle">Movement Mode Changed</text>

        <!-- Input: IA_Dodge -->
        <rect x="192" y="336" width="112" height="72" rx="6" fill="#1a1a1d"/>
        <rect x="192" y="336" width="112" height="72" rx="6" fill="rgba(242,242,243,0.03)" stroke="rgba(242,242,243,0.30)" stroke-width="1"/>
        <rect x="200" y="342" width="36" height="12" rx="2" fill="transparent" stroke="rgba(242,242,243,0.40)" stroke-width="0.8"/>
        <text x="218" y="351" fill="#a1a1aa" font-size="7" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
        <text x="248" y="378" fill="#f2f2f3" font-size="12" font-weight="600" font-family="'Hanken Grotesk', sans-serif" text-anchor="middle">IA_Dodge</text>
        <text x="248" y="394" fill="#a1a1aa" font-size="9" font-family="'Space Mono', monospace" text-anchor="middle">C_ScifiSoo</text>

        <!-- Controller: TryAction -->
        <rect x="344" y="336" width="144" height="72" rx="6" fill="#1a1a1d"/>
        <rect x="344" y="336" width="144" height="72" rx="6" fill="rgba(242,242,243,0.03)" stroke="rgba(242,242,243,0.30)" stroke-width="1"/>
        <rect x="352" y="342" width="64" height="12" rx="2" fill="transparent" stroke="rgba(242,242,243,0.40)" stroke-width="0.8"/>
        <text x="384" y="351" fill="#a1a1aa" font-size="7" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CONTROLLER</text>
        <text x="416" y="374" fill="#f2f2f3" font-size="12" font-weight="600" font-family="'Hanken Grotesk', sans-serif" text-anchor="middle">TryAction</text>
        <text x="416" y="388" fill="#a1a1aa" font-size="9" font-family="'Space Mono', monospace" text-anchor="middle">ActionHeroController</text>
        <text x="416" y="400" fill="#a1a1aa" font-size="9" font-family="'Space Mono', monospace" text-anchor="middle">Send State Tree Event</text>

        <!-- Montage: Play Montage -->
        <rect x="552" y="336" width="128" height="72" rx="6" fill="#1a1a1d"/>
        <rect x="552" y="336" width="128" height="72" rx="6" fill="rgba(242,242,243,0.03)" stroke="rgba(242,242,243,0.30)" stroke-width="1"/>
        <rect x="560" y="342" width="48" height="12" rx="2" fill="transparent" stroke="rgba(242,242,243,0.40)" stroke-width="0.8"/>
        <text x="584" y="351" fill="#a1a1aa" font-size="7" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MONTAGE</text>
        <text x="616" y="374" fill="#f2f2f3" font-size="12" font-weight="600" font-family="'Hanken Grotesk', sans-serif" text-anchor="middle">Play Montage</text>
        <text x="616" y="388" fill="#a1a1aa" font-size="9" font-family="'Space Mono', monospace" text-anchor="middle">On Completed</text>
        <text x="616" y="400" fill="#a1a1aa" font-size="9" font-family="'Space Mono', monospace" text-anchor="middle">sets Is Completed</text>

        <!-- Legend -->
        <line x1="24" y1="436" x2="680" y2="436" stroke="rgba(244,244,245,0.10)" stroke-width="0.8"/>
        <text x="24" y="458" fill="#a1a1aa" font-size="8" font-family="'Space Mono', monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="88" y="449" width="16" height="10" rx="2" fill="#222226" stroke="#5a5a60" stroke-width="1"/>
        <text x="112" y="458" fill="#a1a1aa" font-size="8" font-family="'Space Mono', monospace">State</text>
        <rect x="160" y="449" width="16" height="10" rx="2" fill="#1a1a1d" stroke="#a1a1aa" stroke-width="1"/>
        <text x="184" y="458" fill="#a1a1aa" font-size="8" font-family="'Space Mono', monospace">Evaluator</text>
        <rect x="248" y="449" width="16" height="10" rx="2" fill="rgba(242,242,243,0.03)" stroke="rgba(242,242,243,0.30)" stroke-width="1"/>
        <text x="272" y="458" fill="#a1a1aa" font-size="8" font-family="'Space Mono', monospace">Outside the tree</text>
        <line x1="368" y1="454" x2="392" y2="454" stroke="#a1a1aa" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="400" y="458" fill="#a1a1aa" font-size="8" font-family="'Space Mono', monospace">Transition</text>
        <line x1="472" y1="454" x2="496" y2="454" stroke="#ff3300" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="504" y="458" fill="#a1a1aa" font-size="8" font-family="'Space Mono', monospace">Focal</text>
        <line x1="552" y1="454" x2="576" y2="454" stroke="#a1a1aa" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="584" y="458" fill="#a1a1aa" font-size="8" font-family="'Space Mono', monospace">Value / flag</text>
      </svg>
    </div>
  </div>
</body>
</html>
