      --color-accent:  #ff3300;
      --font-sans:     'Hanken Grotesk', system-ui, sans-serif;
      --font-serif:    'Syne', system-ui, sans-serif;
      --font-mono:     'Space Mono', ui-monospace, monospace; }
      #controller-arch-root { font-family: var(--font-sans); color: var(--color-ink); }
      #controller-arch-root .diagram-container { width: 100%; overflow-x: auto; }
      #controller-arch-root .diagram-container { overflow-x: visible; }</style>
