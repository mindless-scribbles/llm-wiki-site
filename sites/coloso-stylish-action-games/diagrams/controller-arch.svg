        <title id="controller-arch-title">Controllers possess pawns</title>
        <desc id="controller-arch-desc">Class tree of controllers (PlayerController with HeroController, AIController with RoamingController) beside the Pawn tree (Character with C_Hero and C_Enemy), with HeroController possessing C_Hero and RoamingController possessing C_Enemy.</desc>
