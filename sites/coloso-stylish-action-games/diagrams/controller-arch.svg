="348" width="240" height="48" rx="6" fill="#1a1a1d"/><rect x="40" y="348" width="240" height="48" rx="6" fill="#222226" stroke="#5a5a60" stroke-width="1"/><text x="160" y="369" fill="#f2f2f3" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">RoamingController</text><text x="160" y="384" fill="#a1a1aa" font-size="9" font-family="'Space Mono', ui-monospace, monospace" text-anchor="middle">built in lesson 13</text><rect x="424" y="44" width="240" height="48" rx="6" fill="#1a1a1d"/><rect x="424" y="44" width="240" height="48" rx="6" fill="#222226" stroke="#5a5a60" stroke-width="1"/><text x="544" y="65" fill="#f2f2f3" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">Pawn</text><text x="544" y="80" fill="#a1a1aa" font-size="9" font-family="'Space Mono', ui-monospace, monospace" text-anchor="middle">the body · any child can be possessed</text><rect x="424" y="120" width="240" height="48" rx="6" fill="#1a1a1d"/><rect x="424" y="120" width="240" height="48" rx="6" fill="#222226" stroke="#5a5a60" stroke-width="1"/><text x="544" y="148" fill="#f2f2f3" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">Character</text><rect x="424" y="196" width="240" height="48" rx="6" fill="#1a1a1d"/><rect x="424" y="196" width="240" height="48" rx="6" fill="#222226" stroke="#5a5a60" stroke-width="1"/><text x="544" y="217" fill="#f2f2f3" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">C_Hero</text><text x="544" y="232" fill="#a1a1aa" font-size="9" font-family="'Space Mono', ui-monospace, monospace" text-anchor="middle">the hero character</text><rect x="424" y="348" width="240" height="48" rx="6" fill="#1a1a1d"/><rect x="424" y="348" width="240" height="48" rx="6" fill="#222226" stroke="#5a5a60" stroke-width="1"/><text x="544" y="369" fill="#f2f2f3" font-size="12