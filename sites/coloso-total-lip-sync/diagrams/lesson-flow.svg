<title id="lesson-flow-title">The lesson flow</title>
<desc id="lesson-flow-desc">A reader opens the Companion Guide Links, the Lip Sync Library Phonemes List and the Lip Sync Shot Checklist, then takes the fifteen lessons in six stages: analyze dialogue, place shapes, visual appeal, build the library, motion and intent, review and finish. Thirteen lesson pages have a step-by-step tutorial. Concepts, a synthesis and entities are reference. The verbatim transcripts and Flashcards sit behind the scenes.</desc>
